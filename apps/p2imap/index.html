<!doctype html>
<html lang="ko" data-mode="static" data-build="6feb24e989a01689" data-revision="2f484865b56e552792718e167f54a4c7e00ae915a46826474d9e63e314ed7e78"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>P2I Architecture Atlas</title><meta name="description" content="신경망 모델과 개념, 구조, 문헌을 연결한 인터랙티브 지도"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./map.css"><link rel="stylesheet" href="./neon.css?v=6feb24e989a01689"></head>
<body>
<header><a class="brand" href="./"><span class="logo">P2I</span><span>ARCHITECTURE<br><b>ATLAS</b></span></a><div class="header-stats" id="stats">지도를 불러오는 중…</div><nav aria-label="지도 도구"><button class="secondary" data-panel="compare-panel">모델 비교</button><button class="secondary" data-panel="library-panel">노드 목록</button><button class="secondary" data-panel="data-panel">데이터</button></nav></header>
<main>
<div class="toolbar" aria-label="탐색 도구"><label class="search"><span>⌕</span><input id="search" type="search" aria-label="모델·개념·논문 검색" placeholder="모델, 개념, 논문 검색"></label><label class="filter-label">계열 <select id="family" aria-label="모델 계열"><option value="all">모든 계열</option><option value="feedforward">Feedforward</option><option value="vision">Vision</option><option value="sequence">Sequence</option><option value="attention">Attention</option><option value="generative">Generative</option><option value="graph">Graph</option><option value="multimodal">Multimodal</option></select></label><label class="jump-label">모델 <select id="model-select" aria-label="모델 바로가기"></select></label></div>
<div id="search-results" class="search-results" aria-live="polite"></div>
<div class="workspace"><section class="map-card"><div class="map-topbar"><div class="map-modes" role="group" aria-label="지도 범위"><button id="overview" aria-pressed="true">모델 지도</button><button id="neighborhood" aria-pressed="false">선택 노드의 연결</button></div><div class="focus-controls" hidden><label>깊이 <select id="hops" aria-label="탐색 깊이"><option value="1">1단계</option><option value="2">2단계</option></select></label><label>관계 <select id="relation" aria-label="관계 필터"><option value="">모든 관계</option><option value="has_component,uses,subconcept_of">구조와 개념</option><option value="trained_with,applied_to">학습 목적과 과제</option><option value="extends,alternative_to">모델 간 변화</option><option value="documented_in">문헌</option></select></label></div></div><div class="map-viewport"><svg id="map" viewBox="0 0 1400 720" role="group" tabindex="0" aria-label="신경망 아키텍처 지식그래프"></svg><div class="canvas-hint" id="canvas-hint">드래그로 이동 · 휠로 확대 · 노드와 연결선을 눌러 탐색</div><div class="zoom"><button id="zoom-out" aria-label="지도 축소">−</button><button id="zoom-reset" aria-label="지도 전체 보기">전체</button><button id="zoom-in" aria-label="지도 확대">+</button></div></div><div class="map-legend"><div id="family-legend"></div><span><i class="legend-line"></i> 확장 <i class="legend-line dotted"></i> 대안 · 해석적 연결</span></div><div class="map-footer"><span id="map-message"></span><span id="revision"></span></div></section><aside class="inspector"><div class="inspector-heading"><span>선택한 항목</span><button id="collapse-detail" aria-expanded="true" aria-label="상세 패널 접기">접기</button></div><div id="detail" class="detail-card" aria-live="polite"><p>노드를 선택해보세요.</p></div></aside></div>
<p id="global-error" role="alert"></p>
</main>
<dialog id="compare-panel" class="atlas-panel"><div class="panel-heading"><h2>모델 비교</h2><button data-close aria-label="모델 비교 닫기">×</button></div><section class="compare-card"><div class="compare-controls"><select id="compare-left" aria-label="비교할 첫 번째 모델"></select><span>↔</span><select id="compare-right" aria-label="비교할 두 번째 모델"></select><button class="primary" id="compare">비교하기</button></div><div id="comparison" aria-live="polite"></div></section></dialog>
<dialog id="library-panel" class="atlas-panel"><div class="panel-heading"><h2>노드 목록</h2><button data-close aria-label="노드 목록 닫기">×</button></div><section class="library"><div class="section-heading"><select id="library-kind" aria-label="라이브러리 유형"><option value="model">모델</option><option value="concept">개념</option><option value="component">구성 요소</option><option value="objective">학습 목적</option><option value="task">과제</option><option value="paper">논문</option></select></div><div id="concepts" class="concept-grid"></div></section></dialog>
<dialog id="data-panel" class="atlas-panel"><div class="panel-heading"><h2>지도 데이터</h2><button data-close aria-label="지도 데이터 닫기">×</button></div><div class="data-links"><a href="./exports/catalog.ttl" download>OWL / RDF ↓</a><a href="./exports/catalog.jsonld" download>JSON-LD 내보내기 ↗</a><a href="./exports/catalog.json" download>그래프 데이터 ↓</a><a href="./exports/ontology.ttl" download>관계 스키마 ↓</a><a href="./exports/shapes.ttl" download>SHACL Shapes ↓</a></div><section class="extend-card"><h2>지식 연결 이어가기</h2><p>새 노드와 관계가 담긴 JSON 파일을 추가하세요.</p><label class="secondary">온톨로지 조각 추가<input id="patch-file" type="file" accept="application/json,.json"></label><p id="patch-status" aria-live="polite"></p></section><p class="snapshot-note"></p><a class="source-link" href="https://github.com/PtwoI/p2i-kg" target="_blank" rel="noopener noreferrer">소스 코드 ↗</a></dialog>
<dialog id="p2i-panel" class="p2i-panel"><div class="p2i-heading"><div><span class="eyebrow">P2I / MODEL EXPLORER</span><h2 id="p2i-title">모델 구조</h2></div><div class="p2i-window-actions"><a id="p2i-tab" class="secondary" target="_blank" rel="noopener">새 탭 ↗</a><button class="secondary" data-close aria-label="P2I 탐색기 닫기">닫기 ×</button></div></div><p id="p2i-scope"></p><iframe id="p2i-frame" title="P2I 모델 탐색기"></iframe></dialog>
<script type="module" src="./app.js?v=6feb24e989a01689"></script></body></html>
